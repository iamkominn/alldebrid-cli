[package]
name = "alldebrid-cli"
version = "0.1.0"
edition = "2021"
description = "A command-line tool to unlock links with the AllDebrid API"
license = "MIT"

[dependencies]
reqwest = { version = "0.11", features = ["multipart", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
anyhow = "1.0"
dirs = "5.0"